<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>MOO RUN! v0.1</title><style>html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}#wrap{height:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none;max-width:100vw;max-height:100vh}#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));color:#fff;background:#0009;padding:7px 11px;border-radius:999px;font-size:13px;pointer-events:none}</style></head><body><div id='wrap' style='position:relative'><div style="position:absolute;color:white;text-align:center;padding:20px">Loading MOO RUN… 🐄<br><small>If this stays visible, open the file in Safari.</small></div><canvas id='game' width='390' height='720' style='position:relative'></canvas></div><div id='tip'>Tap = jump • Hold = higher jump</div><script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,ground=H*.79,G=2200;let state,cow,obs,grass,parts,last=0,held=false,holdT=0,best=0;
try { best=Number(localStorage.getItem('mooRunBest')||0); } catch(e) { best=0; }function fit(){let s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}addEventListener('resize',fit);fit();
function reset(){state={started:false,over:false,score:0,dist:0,speed:260,boost:0,meter:0,spawn:0,grassSpawn:0};cow={x:72,y:ground-54,vy:0,w:58,h:46,on:true,size:1};obs=[];grass=[];parts=[];holdT=0}reset();
function jump(){if(state.over){reset();return}state.started=true;if(cow.on){cow.vy=-760;cow.on=false;holdT=0}}function down(e){e.preventDefault();held=true;jump()}function up(e){e.preventDefault();held=false}c.addEventListener('pointerdown',down);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){held=true;jump()}});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')held=false});
const R=a=>({l:a.x,r:a.x+a.w,t:a.y,b:a.y+a.h});function hit(a,b){let A=R(a),B=R(b);return A.l<B.r&&A.r>B.l&&A.t<B.b&&A.b>B.t}
function addObstacle(){let t=[['fence',34,70],['hay',58,52],['mud',72,22],['crate',48,48]][Math.floor(Math.random()*4)];obs.push({x:W+20,y:ground-t[2],w:t[1],h:t[2],kind:t[0]})}function addGrass(){let n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)grass.push({x:W+30+i*30,y:ground-95-Math.random()*65,w:24,h:24})}
function burst(px,py,e,n=8){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*340,vy:-100-Math.random()*320,t:1,e})}function gameOver(){if(state.boost>0)return;state.over=true;best=Math.max(best,Math.floor(state.dist));try { localStorage.setItem('mooRunBest', String(best)); } catch(e) {}burst(cow.x+cow.w/2,cow.y+cow.h/2,'💥',12);navigator.vibrate?.(80)}
function update(dt){if(!state.started||state.over){parts.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt});return}state.speed=Math.min(650,state.speed+6*dt);state.dist+=state.speed*dt/9;state.score=Math.floor(state.dist);if(held&&!cow.on&&holdT<.18&&cow.vy<0){cow.vy-=950*dt;holdT+=dt}cow.vy+=G*dt;cow.y+=cow.vy*dt;if(cow.y+cow.h>=ground){cow.y=ground-cow.h;cow.vy=0;cow.on=true}state.spawn-=dt;if(state.spawn<=0){addObstacle();state.spawn=.9+Math.random()*.65}state.grassSpawn-=dt;if(state.grassSpawn<=0){addGrass();state.grassSpawn=.7+Math.random()*.9}obs.forEach(o=>o.x-=state.speed*dt);grass.forEach(g=>g.x-=state.speed*dt);obs=obs.filter(o=>o.x+o.w>-30);grass=grass.filter(g=>g.x+g.w>-30);for(const g of grass)if(!g.got&&hit(cow,g)){g.got=true;state.meter=Math.min(100,state.meter+12);cow.size=Math.min(1.28,cow.size+.015);burst(g.x,g.y,'🌱',4);if(state.meter>=100){state.boost=5;state.meter=0;burst(cow.x,cow.y,'⚡',12)}}grass=grass.filter(g=>!g.got);if(state.boost>0){state.boost-=dt;cow.size=Math.max(1,cow.size-.02*dt);for(const o of obs)if(!o.dead&&hit(cow,o)){o.dead=true;state.dist+=35;burst(o.x,o.y,'💥',8)}}else for(const o of obs)if(!o.dead&&hit(cow,o)){gameOver();break}obs=obs.filter(o=>!o.dead);parts.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt});parts=parts.filter(p=>p.t>0)}
function emoji(t,px,py,s,a='left'){x.save();x.font=s+'px Apple Color Emoji,Segoe UI Emoji,sans-serif';x.textAlign=a;x.textBaseline='middle';x.fillText(t,px,py);x.restore()}function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7ec8ff');sky.addColorStop(.7,'#dff3ff');sky.addColorStop(.701,'#74bd47');sky.addColorStop(1,'#3d8f36');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#6fae43';x.beginPath();x.moveTo(0,ground);x.quadraticCurveTo(70,520,150,ground);x.quadraticCurveTo(260,535,390,ground);x.closePath();x.fill();x.fillStyle='#6f4a2e';x.fillRect(0,ground,W,8);emoji('☁️',48,90,45);emoji('☁️',310,145,36);emoji('🌳',338,ground-44,58);emoji('🌳',18,ground-35,50);grass.forEach(g=>emoji('🌱',g.x+12,g.y+12,25,'center'));for(const o of obs){let e=o.kind==='fence'?'🚧':o.kind==='hay'?'🟨':o.kind==='mud'?'🟤':'📦';emoji(e,o.x+o.w/2,o.y+o.h/2,o.kind==='mud'?62:50,'center')}x.save();let cx=cow.x+cow.w/2,cy=cow.y+cow.h/2;x.translate(cx,cy);x.scale(cow.size,cow.size);if(state.boost>0){x.shadowColor='gold';x.shadowBlur=24}emoji('🐄',0,0,58,'center');x.restore();for(const p of parts){x.globalAlpha=Math.max(0,p.t);emoji(p.e,p.x,p.y,22,'center')}x.globalAlpha=1;x.fillStyle='#0009';x.fillRect(14,14,150,72);x.fillStyle='white';x.font='700 20px system-ui';x.fillText('MOO RUN!',26,40);x.font='600 15px system-ui';x.fillText('Score: '+state.score,26,64);x.fillText('Best: '+best,92,64);x.fillStyle='#0008';x.fillRect(190,23,180,22);x.fillStyle=state.boost>0?'#ffd54f':'#76ff7a';x.fillRect(194,27,172*(state.boost>0?state.boost/5:state.meter/100),14);x.fillStyle='white';x.font='700 11px system-ui';x.textAlign='center';x.fillText(state.boost>0?'MOO BOOST!':'MOO METER',280,40);x.textAlign='left';if(!state.started&&!state.over){x.fillStyle='#000b';x.fillRect(35,245,320,190);x.fillStyle='white';x.textAlign='center';x.font='800 34px system-ui';x.fillText('MOO RUN! 🐄',W/2,292);x.font='600 18px system-ui';x.fillText('Tap to jump.',W/2,333);x.fillText('Eat grass. Get bigger.',W/2,360);x.fillText('Fill the meter → MOO BOOST!',W/2,387);x.font='800 21px system-ui';x.fillText('TAP TO START',W/2,420);x.textAlign='left'}if(state.over){x.fillStyle='#000c';x.fillRect(35,245,320,205);x.fillStyle='white';x.textAlign='center';x.font='900 34px system-ui';x.fillText('MOOOOPS! 😂',W/2,292);x.font='700 23px system-ui';x.fillText('Score: '+state.score,W/2,335);x.font='600 17px system-ui';x.fillText('Best: '+best,W/2,366);let d=best-state.score;if(d>0&&d<80)x.fillText('Only '+d+'m from your best!',W/2,397);x.font='900 23px system-ui';x.fillText('TAP → AGAIN',W/2,430);x.textAlign='left'}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
