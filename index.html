<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MOO RUN! v0.5</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0b;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;max-width:100vw;max-height:100vh;background:#7ec8ff}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(9px + env(safe-area-inset-bottom));
color:#fff;background:#000a;padding:7px 12px;border-radius:999px;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="390" height="720"></canvas></div>
<div id="tip">Tap = jump • Hold = higher jump</div>
<script>
(()=>{
const C=document.getElementById('game'),g=C.getContext('2d'),W=C.width,H=C.height,GROUND=570,GRAV=2200;
let last=0,held=false,holdT=0,best=0,audioCtx=null;
try{
  best=+localStorage.getItem('mooBestV5')||+localStorage.getItem('mooBestV4')||0
}catch(e){}
let S,cow,obs,pickups,parts,bgChickens;

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px'}addEventListener('resize',fit);fit();

function reset(){
 S={started:false,over:false,score:0,dist:0,speed:275,meter:0,boost:0,spawn:.9,pick:.6,farmer:0,tractorWarn:0,shake:0,streak:0,
 stage:1,lastStage:1,banner:'',bannerT:0,panic:false,sharePressed:false};
 cow={x:78,y:GROUND-48,vy:0,w:66,h:46,on:true,t:0};
 obs=[];pickups=[];parts=[];bgChickens=[{x:255,y:GROUND-18,v:-18},{x:335,y:GROUND-16,v:-13}];
}
reset();

function beep(freq=440,dur=.06,type='sine',vol=.05){
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),gn=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;gn.gain.value=vol;o.connect(gn);gn.connect(audioCtx.destination);
  o.start();gn.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
function jump(){
 if(S.over){reset();return}
 S.started=true;
 if(cow.on){cow.vy=-770;cow.on=false;holdT=0;beep(520,.05,'square',.035)}
}
async function shareScore(){
 const score=Math.floor(S.score||0);
 const text=`I scored ${score} in MOO RUN! 🐄💨 Can you beat me?`;
 const url=location.href;
 try{
  if(navigator.share){await navigator.share({title:'MOO RUN!',text,url})}
  else if(navigator.clipboard){await navigator.clipboard.writeText(`${text} ${url}`);S.banner='CHALLENGE LINK COPIED!';S.bannerT=1.8}
  else{S.banner='SHARE: '+url;S.bannerT=2.2}
 }catch(e){}
}
function pd(e){
 e.preventDefault();
 const r=C.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
 const px=(e.clientX-r.left)*sx,py=(e.clientY-r.top)*sy;
 if(S.over && px>73 && px<317 && py>402 && py<447){shareScore();return}
 held=true;jump()
}
function pu(e){e.preventDefault();held=false}
C.addEventListener('pointerdown',pd);C.addEventListener('pointerup',pu);C.addEventListener('pointercancel',pu);

function hit(a,b,pad=4){return a.x+pad<b.x+b.w-pad&&a.x+a.w-pad>b.x+pad&&a.y+pad<b.y+b.h-pad&&a.y+a.h-pad>b.y+pad}
function burst(x,y,color,n=10){
 for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*300,vy:-80-Math.random()*260,t:.8+Math.random()*.3,color});
}
function addObstacle(){
 const r=Math.random();
 let o;
 if(r<.28)o={kind:'fence',w:46,h:52};
 else if(r<.52)o={kind:'hay',w:54,h:50};
 else if(r<.70)o={kind:'mud',w:76,h:16};
 else if(r<.88)o={kind:'chicken',w:38,h:34,phase:Math.random()*6.28};
 else {o={kind:'tractor',w:74,h:54};S.tractorWarn=.75;}
 o.x=W+24;o.y=GROUND-o.h;o.baseY=o.y;obs.push(o);
}
function addPickups(){
 const n=2+((Math.random()*3)|0),baseY=GROUND-92-Math.random()*52;
 for(let i=0;i<n;i++)pickups.push({x:W+30+i*28,y:baseY-Math.sin(i*.9)*20,w:22,h:22,got:false});
}
function gameOver(){
 if(S.boost>0)return;
 S.over=true;S.shake=.25;best=Math.max(best,Math.floor(S.dist));
 try{localStorage.setItem('mooBestV5',best)}catch(e){}
 burst(cow.x+cow.w/2,cow.y+cow.h/2,'#ffd54f',18);navigator.vibrate?.(60);beep(110,.18,'sawtooth',.06);
}
function update(dt){
 cow.t+=dt;
 for(const b of bgChickens){b.x+=b.v*dt;if(b.x<-30)b.x=W+Math.random()*120}
 if(!S.started||S.over){parts.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=650*dt});parts=parts.filter(p=>p.t>0);return}
 S.dist+=S.speed*dt/8.7;S.score=Math.floor(S.dist);
 // v0.5 difficulty stages: clear milestones instead of invisible endless acceleration.
 S.stage=Math.min(6,1+Math.floor(S.score/500));
 const targetSpeeds=[0,275,330,390,455,530,620];
 S.speed += (targetSpeeds[S.stage]-S.speed)*Math.min(1,dt*1.7);
 S.panic=S.stage>=5;
 if(S.stage!==S.lastStage){
   S.lastStage=S.stage;
   S.banner=S.stage>=5?'FARM PANIC MODE! 🔥':`STAGE ${S.stage}!`;
   S.bannerT=2.0;
   S.shake=.12;beep(250+S.stage*70,.09,'square',.04);
 }
 if(held&&!cow.on&&holdT<.18&&cow.vy<0){cow.vy-=980*dt;holdT+=dt}
 cow.vy+=GRAV*dt;cow.y+=cow.vy*dt;if(cow.y+cow.h>=GROUND){cow.y=GROUND-cow.h;cow.vy=0;cow.on=true}
 S.spawn-=dt;if(S.spawn<=0){addObstacle();S.spawn=Math.max(.56,.92-S.stage*.055)+Math.random()*Math.max(.34,.72-S.stage*.05)}
 S.pick-=dt;if(S.pick<=0){addPickups();S.pick=.85+Math.random()*1.05}
 S.tractorWarn=Math.max(0,S.tractorWarn-dt);S.farmer=Math.max(0,S.farmer-dt);S.shake=Math.max(0,S.shake-dt);S.bannerT=Math.max(0,S.bannerT-dt);
 if(Math.random()<.0025&&S.farmer<=0)S.farmer=1.8;

 for(const o of obs){o.x-=S.speed*dt;if(o.kind==='chicken')o.y=o.baseY-Math.abs(Math.sin(performance.now()/160+o.phase))*12}
 for(const p of pickups)p.x-=S.speed*dt;
 obs=obs.filter(o=>o.x+o.w>-40);pickups=pickups.filter(p=>p.x+p.w>-40&&!p.got);

 for(const p of pickups)if(!p.got&&hit(cow,p,-2)){p.got=true;S.meter=Math.min(100,S.meter+10);S.streak++;burst(p.x,p.y,'#7CFC00',5);beep(760,.035,'triangle',.025);
  if(S.meter>=100){S.meter=0;S.boost=4.5;S.shake=.08;beep(170,.12,'sawtooth',.05)}
 }
 if(S.boost>0){
  S.boost-=dt;
  for(const o of obs)if(!o.dead&&hit(cow,o,2)){o.dead=true;S.dist+=30;burst(o.x,o.y,'#ffca28',12);beep(210,.04,'square',.03)}
 }else{
  for(const o of obs)if(!o.dead&&hit(cow,o,5)){gameOver();break}
 }
 obs=obs.filter(o=>!o.dead);
 parts.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=650*dt});parts=parts.filter(p=>p.t>0);
}

function roundRect(x,y,w,h,r,fill,stroke){
 g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}
}
function drawCloud(x,y,s){g.fillStyle='#fff';g.globalAlpha=.92;g.beginPath();g.arc(x,y,s*.25,0,7);g.arc(x+s*.22,y-s*.08,s*.32,0,7);g.arc(x+s*.5,y,s*.25,0,7);g.fill();g.globalAlpha=1}
function drawChicken(x,y,scale=1){
 g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,13,10,0,0,7);g.fill();
 g.fillStyle='#f44336';g.beginPath();g.arc(8,-8,4,0,7);g.fill();g.fillStyle='#ff9800';g.beginPath();g.moveTo(12,-4);g.lineTo(19,-1);g.lineTo(12,2);g.fill();
 g.strokeStyle='#7a4b22';g.lineWidth=2;g.beginPath();g.moveTo(-2,8);g.lineTo(-4,15);g.moveTo(5,8);g.lineTo(6,15);g.stroke();g.restore();
}
function drawFarmer(x,y){
 g.save();g.translate(x,y);g.fillStyle='#2f6fb4';g.fillRect(-10,2,20,28);g.fillStyle='#f3c38a';g.beginPath();g.arc(0,-8,11,0,7);g.fill();
 g.fillStyle='#8d5524';g.fillRect(-13,-20,26,5);g.fillRect(-8,-25,16,6);g.fillStyle='#5b3217';g.beginPath();g.arc(0,-9,10,3.2,6.25);g.fill();
 g.strokeStyle='#7d4a22';g.lineWidth=5;g.beginPath();g.moveTo(-7,27);g.lineTo(-10,42);g.moveTo(7,27);g.lineTo(10,42);g.stroke();g.restore();
}
function drawCow(x,y,scale=1,air=false){
 const bob=cow.on?Math.sin(cow.t*14)*2.2:0;
 const lean=air?Math.max(-.18,Math.min(.16,cow.vy/2200)):Math.sin(cow.t*10)*.015;
 g.save();g.translate(x,y+bob);g.rotate(lean);g.scale(scale,scale);
 if(S.boost>0){g.shadowColor='#ffd54f';g.shadowBlur=22}
 // body
 g.fillStyle='#fff';g.strokeStyle='#222';g.lineWidth=2.2;g.beginPath();g.ellipse(3,0,27,17,0,0,7);g.fill();g.stroke();
 // patches
 g.fillStyle='#222';g.beginPath();g.ellipse(-9,-7,8,6,.4,0,7);g.fill();g.beginPath();g.ellipse(12,5,7,6,-.3,0,7);g.fill();
 // head faces RIGHT
 g.fillStyle='#fff';g.beginPath();g.ellipse(29,-4,13,12,0,0,7);g.fill();g.stroke();
 g.fillStyle='#222';g.beginPath();g.ellipse(25,-8,6,5,0,0,7);g.fill();
 // muzzle
 g.fillStyle='#f6b7ad';g.beginPath();g.ellipse(39,1,8,6,0,0,7);g.fill();g.stroke();
 g.fillStyle='#111';g.beginPath();g.arc(37,0,1.2,0,7);g.arc(42,1,1.2,0,7);g.fill();
 // eye gets wider in air / panic
 const er=air||S.panic?4.2:3.3;
 g.fillStyle='#fff';g.beginPath();g.arc(31,-7,er,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(32,-7,1.5,0,7);g.fill();
 // horn + ear
 g.fillStyle='#e0b45f';g.beginPath();g.moveTo(24,-15);g.lineTo(27,-22);g.lineTo(30,-15);g.fill();
 g.fillStyle='#222';g.beginPath();g.ellipse(21,-11,6,3,-.3,0,7);g.fill();
 // swinging tail
 const tail=Math.sin(cow.t*11)*6;
 g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(-24,-2);g.quadraticCurveTo(-35,-9+tail*.15,-34,7+tail);g.stroke();
 g.beginPath();g.arc(-34,8+tail,3,0,7);g.fill();
 // four-leg illusion: opposite running pairs
 const phase=Math.sin(cow.t*(S.panic?19:15))*(cow.on?7:2);
 g.strokeStyle='#222';g.lineWidth=4.5;g.lineCap='round';
 g.beginPath();
 g.moveTo(-12,12);g.lineTo(-12+phase,24);
 g.moveTo(-3,12);g.lineTo(-3-phase*.7,23);
 g.moveTo(8,12);g.lineTo(8-phase,24);
 g.moveTo(16,11);g.lineTo(16+phase*.65,22);
 g.stroke();
 g.restore();
}
function drawFence(o){g.strokeStyle='#7a4b21';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(o.x+8,GROUND-48);g.lineTo(o.x+8,GROUND);g.moveTo(o.x+38,GROUND-48);g.lineTo(o.x+38,GROUND);g.moveTo(o.x+5,GROUND-35);g.lineTo(o.x+41,GROUND-35);g.moveTo(o.x+5,GROUND-18);g.lineTo(o.x+41,GROUND-18);g.stroke()}
function drawHay(o){g.fillStyle='#e7a924';roundRect(o.x,o.y,o.w,o.h,6,'#e7a924','#a56b00');g.strokeStyle='#f6d46a';g.lineWidth=2;for(let i=0;i<5;i++){g.beginPath();g.moveTo(o.x+8+i*9,o.y+5);g.lineTo(o.x+3+i*9,o.y+o.h-5);g.stroke()}}
function drawMud(o){g.fillStyle='#6b3e20';g.beginPath();g.ellipse(o.x+o.w/2,GROUND-5,o.w/2,10,0,0,7);g.fill();g.fillStyle='#9c6339';g.beginPath();g.ellipse(o.x+o.w/2,GROUND-7,o.w*.32,5,0,0,7);g.fill()}
function drawTractor(o){
 g.fillStyle='#c62828';roundRect(o.x+8,o.y+12,48,28,5,'#c62828','#7a1111');g.fillStyle='#263238';g.beginPath();g.arc(o.x+19,GROUND-7,12,0,7);g.arc(o.x+57,GROUND-7,16,0,7);g.fill();
 g.fillStyle='#90caf9';g.fillRect(o.x+23,o.y+2,24,16);g.fillStyle='#333';g.fillRect(o.x+47,o.y-5,5,18)
}

function draw(){
 g.save();if(S.shake>0)g.translate((Math.random()-.5)*7,(Math.random()-.5)*5);
 const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#70c7ff');grad.addColorStop(.72,'#dff5ff');grad.addColorStop(.721,'#7fc64b');grad.addColorStop(1,'#3d8f39');g.fillStyle=grad;g.fillRect(-10,-10,W+20,H+20);
 drawCloud(52,95,54);drawCloud(282,150,44);drawCloud(195,62,36);
 // hills
 g.fillStyle='#6fb246';g.beginPath();g.moveTo(0,GROUND);g.quadraticCurveTo(100,470,210,GROUND);g.quadraticCurveTo(300,495,390,GROUND);g.closePath();g.fill();
 // barn + windmill
 g.fillStyle='#b73a2f';g.fillRect(290,GROUND-103,60,72);g.fillStyle='#7b241c';g.beginPath();g.moveTo(282,GROUND-103);g.lineTo(320,GROUND-135);g.lineTo(358,GROUND-103);g.fill();
 g.fillStyle='#fff';g.fillRect(309,GROUND-78,22,47);g.strokeStyle='#ddd';g.strokeRect(309,GROUND-78,22,47);
 g.strokeStyle='#555';g.lineWidth=3;g.beginPath();g.moveTo(270,GROUND-120);g.lineTo(270,GROUND-42);g.stroke();g.beginPath();g.arc(270,GROUND-122,15,0,7);g.stroke();
 for(let a=0;a<4;a++){g.save();g.translate(270,GROUND-122);g.rotate(a*Math.PI/2);g.beginPath();g.moveTo(0,0);g.lineTo(0,-25);g.stroke();g.restore()}
 // fence horizon
 g.strokeStyle='#b88755';g.lineWidth=3;for(let x=0;x<W;x+=42){g.beginPath();g.moveTo(x,GROUND-35);g.lineTo(x,GROUND-9);g.stroke()}g.beginPath();g.moveTo(0,GROUND-26);g.lineTo(W,GROUND-26);g.stroke();
 for(const b of bgChickens)drawChicken(b.x,b.y,.65);
 g.fillStyle='#6a452b';g.fillRect(0,GROUND,W,8);

 for(const p of pickups){g.fillStyle='#68d13f';g.beginPath();g.ellipse(p.x+11,p.y+11,4,12,.2,0,7);g.ellipse(p.x+7,p.y+13,4,10,-.5,0,7);g.ellipse(p.x+15,p.y+13,4,10,.5,0,7);g.fill()}
 for(const o of obs){
  if(o.kind==='fence')drawFence(o);else if(o.kind==='hay')drawHay(o);else if(o.kind==='mud')drawMud(o);else if(o.kind==='chicken')drawChicken(o.x+18,o.y+18,1);else drawTractor(o)
 }
 if(S.farmer>0){drawFarmer(W-38,GROUND-44);roundRect(W-192,GROUND-128,145,58,12,'#fff','#333');g.fillStyle='#222';g.font='700 14px system-ui';g.textAlign='center';g.fillText('Hey! Watch',W-120,GROUND-105);g.fillText('where you’re going!',W-120,GROUND-86);g.textAlign='left'}
 if(S.tractorWarn>0){roundRect(112,100,166,42,12,'#000a');g.fillStyle='#ffd54f';g.font='900 18px system-ui';g.textAlign='center';g.fillText('🚜 TRACTOR!',195,127);g.textAlign='left'}
 if(S.bannerT>0){roundRect(73,150,244,48,14,S.panic?'#8b1010e8':'#102735e8','#ffd54f');g.fillStyle='#fff';g.font='900 19px system-ui';g.textAlign='center';g.fillText(S.banner,195,180);g.textAlign='left'}
 drawCow(cow.x+cow.w/2,cow.y+cow.h/2,1+(S.boost>0?.08:0),!cow.on);
 for(const p of parts){g.globalAlpha=Math.max(0,p.t);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill()}g.globalAlpha=1;

 // HUD
 roundRect(12,12,178,82,9,'#16364de6');g.fillStyle='#fff';g.font='900 20px system-ui';g.fillText('MOO RUN!',24,39);
 g.font='800 13px system-ui';g.fillStyle='#fff';g.fillText('SCORE',24,60);g.fillStyle='#8ff0ff';g.font='900 17px system-ui';g.fillText(String(S.score),24,80);
 g.fillStyle='#fff';g.font='800 13px system-ui';g.fillText('BEST',104,60);g.fillStyle='#ffd54f';g.font='900 17px system-ui';g.fillText(String(best),104,80);
 roundRect(202,22,168,26,8,'#1c3445e8');g.fillStyle='#142018';g.fillRect(207,29,158,12);g.fillStyle=S.boost>0?'#ffd54f':'#5cff6c';g.fillRect(207,29,158*(S.boost>0?S.boost/4.5:S.meter/100),12);
 g.fillStyle='#fff';g.font='900 11px system-ui';g.textAlign='center';g.fillText(S.boost>0?'MOO BOOST!':'MOO METER',286,42);
 g.fillStyle=S.panic?'#ff5d5d':'#fff';g.font='800 11px system-ui';g.fillText(S.panic?'PANIC':'STAGE '+S.stage,286,62);g.textAlign='left';

 if(!S.started&&!S.over){
  roundRect(38,235,314,214,14,'#102735ed','#8b5a2b');g.fillStyle='#fff';g.textAlign='center';g.font='900 36px system-ui';g.fillText('MOO RUN!',195,288);
  g.font='700 18px system-ui';g.fillText('Tap to jump',195,330);g.fillText('Eat grass • Fill MOO meter',195,360);g.fillText('Smash obstacles in MOO BOOST',195,390);
  g.fillStyle='#ffd54f';g.font='900 23px system-ui';g.fillText('TAP TO START',195,427);g.textAlign='left';
 }
 if(S.over){
  roundRect(45,230,300,245,14,'#102735f2','#8b5a2b');g.fillStyle='#fff';g.textAlign='center';g.font='900 33px system-ui';g.fillText('MOOOOPS! 😂',195,274);
  g.font='900 24px system-ui';g.fillText('Score: '+S.score,195,317);g.font='800 18px system-ui';g.fillText('Best: '+best,195,348);
  const d=best-S.score;if(d>0&&d<100){g.font='700 14px system-ui';g.fillText('Only '+d+'m from your best!',195,374)}
  roundRect(73,402,244,45,12,'#ffd54f','#8b5a2b');g.fillStyle='#172a3a';g.font='900 18px system-ui';g.fillText('📤 CHALLENGE A FRIEND',195,431);
  g.fillStyle='#fff';g.font='900 19px system-ui';g.fillText('TAP ANYWHERE ELSE → AGAIN',195,464);g.textAlign='left';
 }
 g.restore();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
