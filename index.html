<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>MOO RUN! v0.3</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  canvas{touch-action:none;display:block;max-width:100vw;max-height:100vh}
  #tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
       color:white;background:#0009;padding:7px 11px;border-radius:999px;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="390" height="720"></canvas></div>
<div id="tip">Tap = jump • Hold = higher jump</div>
<script>
(() => {
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=c.width,H=c.height,ground=H*0.79,G=2200;
let state,cow,obs,grass,particles,decor,last=0,held=false,holdT=0,best=0;
try{best=Number(localStorage.getItem('mooRunBest')||0)}catch(e){best=0}

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

function reset(){
 state={started:false,over:false,score:0,dist:0,speed:260,boost:0,meter:0,spawn:0.7,grassSpawn:0.5,farmerT:0};
 cow={x:72,y:ground-54,vy:0,w:58,h:46,on:true,size:1};
 obs=[];grass=[];particles=[];decor=[];holdT=0;
}
reset();

function jump(){
 if(state.over){reset();return}
 state.started=true;
 if(cow.on){cow.vy=-760;cow.on=false;holdT=0}
}
function down(e){e.preventDefault();held=true;jump()}
function up(e){e.preventDefault();held=false}
c.addEventListener('pointerdown',down);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

function rect(a){return {l:a.x,r:a.x+a.w,t:a.y,b:a.y+a.h}}
function hit(a,b){const A=rect(a),B=rect(b);return A.l<B.r&&A.r>B.l&&A.t<B.b&&A.b>B.t}

function addObstacle(){
 const roll=Math.random();
 let o;
 if(roll<.27)o={kind:'fence',w:42,h:70};
 else if(roll<.52)o={kind:'hay',w:58,h:52};
 else if(roll<.72)o={kind:'mud',w:76,h:22};
 else if(roll<.88)o={kind:'chicken',w:38,h:34};
 else o={kind:'crate',w:48,h:48};
 o.x=W+25;o.y=ground-o.h;o.baseY=o.y;o.phase=Math.random()*6.28;
 obs.push(o);
}
function addGrass(){
 const n=1+((Math.random()*3)|0);
 for(let i=0;i<n;i++)grass.push({x:W+30+i*30,y:ground-95-Math.random()*70,w:24,h:24});
}
function burst(px,py,e,n=8){
 for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*340,vy:-100-Math.random()*320,t:1,emoji:e});
}
function gameOver(){
 if(state.boost>0)return;
 state.over=true;best=Math.max(best,Math.floor(state.dist));
 try{localStorage.setItem('mooRunBest',String(best))}catch(e){}
 burst(cow.x+cow.w/2,cow.y+cow.h/2,'💥',12);
 navigator.vibrate?.(80);
}

function update(dt){
 if(!state.started||state.over){
  particles.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt});
  return;
 }
 state.speed=Math.min(650,state.speed+6*dt);
 state.dist+=state.speed*dt/9;state.score=Math.floor(state.dist);
 if(held&&!cow.on&&holdT<.18&&cow.vy<0){cow.vy-=950*dt;holdT+=dt}
 cow.vy+=G*dt;cow.y+=cow.vy*dt;
 if(cow.y+cow.h>=ground){cow.y=ground-cow.h;cow.vy=0;cow.on=true}

 state.spawn-=dt;
 if(state.spawn<=0){addObstacle();state.spawn=.82+Math.random()*.72}
 state.grassSpawn-=dt;
 if(state.grassSpawn<=0){addGrass();state.grassSpawn=.65+Math.random()*.95}

 if(Math.random()<0.0035 && state.farmerT<=0)state.farmerT=2.2;
 state.farmerT=Math.max(0,state.farmerT-dt);

 for(const o of obs){
   o.x-=state.speed*dt;
   if(o.kind==='chicken')o.y=o.baseY-Math.abs(Math.sin(performance.now()/180+o.phase))*9;
 }
 for(const g of grass)g.x-=state.speed*dt;
 obs=obs.filter(o=>o.x+o.w>-30);grass=grass.filter(g=>g.x+g.w>-30);

 for(const g of grass){
  if(!g.got&&hit(cow,g)){
   g.got=true;state.meter=Math.min(100,state.meter+12);cow.size=Math.min(1.28,cow.size+.015);
   burst(g.x,g.y,'🌱',4);
   if(state.meter>=100){state.boost=5;state.meter=0;burst(cow.x,cow.y,'⚡',12)}
  }
 }
 grass=grass.filter(g=>!g.got);

 if(state.boost>0){
  state.boost-=dt;cow.size=Math.max(1,cow.size-.02*dt);
  for(const o of obs)if(!o.dead&&hit(cow,o)){o.dead=true;state.dist+=35;burst(o.x,o.y,'💥',8)}
 }else{
  for(const o of obs)if(!o.dead&&hit(cow,o)){gameOver();break}
 }
 obs=obs.filter(o=>!o.dead);

 particles.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt});
 particles=particles.filter(p=>p.t>0);
}

function emoji(txt,x,y,size,align='left',flip=false){
 ctx.save();ctx.translate(x,y);
 if(flip)ctx.scale(-1,1);
 ctx.font=size+'px Apple Color Emoji,Segoe UI Emoji,sans-serif';
 ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(txt,0,0);
 ctx.restore();
}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#70c4ff');sky.addColorStop(.68,'#e5f6ff');sky.addColorStop(.681,'#79c84a');sky.addColorStop(1,'#3b9139');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // farm background
 ctx.fillStyle='#63ad45';ctx.beginPath();ctx.moveTo(0,ground);ctx.quadraticCurveTo(80,525,165,ground);ctx.quadraticCurveTo(285,540,390,ground);ctx.closePath();ctx.fill();
 emoji('☁️',55,95,44);emoji('☁️',315,145,34);
 emoji('🏠',314,ground-86,70);emoji('🌳',350,ground-45,60);emoji('🌳',22,ground-38,52);
 emoji('🐔',30,ground-20,28);emoji('🐤',54,ground-15,22);
 ctx.fillStyle='#6c472d';ctx.fillRect(0,ground,W,8);

 for(const g of grass)emoji('🌱',g.x+12,g.y+12,25,'center');

 for(const o of obs){
  if(o.kind==='fence')emoji('🚧',o.x+o.w/2,o.y+o.h/2,52,'center');
  else if(o.kind==='hay')emoji('🟨',o.x+o.w/2,o.y+o.h/2,54,'center');
  else if(o.kind==='mud')emoji('🟤',o.x+o.w/2,o.y+o.h/2,64,'center');
  else if(o.kind==='crate')emoji('📦',o.x+o.w/2,o.y+o.h/2,48,'center');
  else if(o.kind==='chicken')emoji('🐔',o.x+o.w/2,o.y+o.h/2,38,'center');
 }

 // farmer cameo
 if(state.started && state.farmerT>0){
  emoji('👨‍🌾',W-46,ground-44,54,'center');
  ctx.fillStyle='white';ctx.strokeStyle='#333';ctx.lineWidth=2;
  const bx=W-180,by=ground-125,bw=145,bh=58;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#222';ctx.font='700 14px system-ui';ctx.textAlign='center';
  ctx.fillText('Hey! Watch',bx+bw/2,by+23);ctx.fillText('where you’re going!',bx+bw/2,by+42);
  ctx.textAlign='left';
 }

 // cow: FLIPPED so head faces RIGHT
 ctx.save();
 const cx=cow.x+cow.w/2,cy=cow.y+cow.h/2;
 ctx.translate(cx,cy);ctx.scale(-cow.size,cow.size);
 if(state.boost>0){ctx.shadowColor='gold';ctx.shadowBlur=24}
 ctx.font='58px Apple Color Emoji,Segoe UI Emoji,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐄',0,0);
 ctx.restore();

 for(const p of particles){ctx.globalAlpha=Math.max(0,p.t);emoji(p.emoji,p.x,p.y,22,'center')}ctx.globalAlpha=1;

 ctx.fillStyle='#0009';ctx.fillRect(14,14,160,72);ctx.fillStyle='white';ctx.font='800 20px system-ui';ctx.fillText('MOO RUN!',26,40);
 ctx.font='700 14px system-ui';ctx.fillText('Score: '+state.score,26,64);ctx.fillText('Best: '+best,95,64);

 ctx.fillStyle='#0008';ctx.fillRect(195,23,175,22);
 ctx.fillStyle=state.boost>0?'#ffd54f':'#72ff77';
 ctx.fillRect(199,27,167*(state.boost>0?state.boost/5:state.meter/100),14);
 ctx.fillStyle='white';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillText(state.boost>0?'MOO BOOST!':'MOO METER',282,40);ctx.textAlign='left';

 if(!state.started&&!state.over){
  ctx.fillStyle='#000c';ctx.fillRect(35,240,320,205);
  ctx.fillStyle='white';ctx.textAlign='center';ctx.font='900 35px system-ui';ctx.fillText('MOO RUN! 🐄',W/2,290);
  ctx.font='700 18px system-ui';ctx.fillText('Tap to jump.',W/2,332);ctx.fillText('Eat grass. Get bigger.',W/2,360);
  ctx.fillText('Fill the meter → MOO BOOST!',W/2,389);
  ctx.fillStyle='#ffd54f';ctx.font='900 23px system-ui';ctx.fillText('TAP TO START',W/2,425);ctx.textAlign='left';
 }
 if(state.over){
  ctx.fillStyle='#000d';ctx.fillRect(42,248,306,205);
  ctx.fillStyle='white';ctx.textAlign='center';ctx.font='900 34px system-ui';ctx.fillText('MOOOOPS! 😂',W/2,296);
  ctx.font='800 23px system-ui';ctx.fillText('Score: '+state.score,W/2,340);
  ctx.font='700 17px system-ui';ctx.fillText('Best: '+best,W/2,371);
  const diff=best-state.score;
  if(diff>0&&diff<80)ctx.fillText('Only '+diff+'m from your best!',W/2,401);
  ctx.fillStyle='#ffd54f';ctx.font='900 23px system-ui';ctx.fillText('TAP → AGAIN',W/2,436);ctx.textAlign='left';
 }
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
